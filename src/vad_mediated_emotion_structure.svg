<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1420" viewBox="0 0 960 1420" role="img" aria-labelledby="title desc">
  <title id="title">VAD媒介型感情分類モデルの縦方向フロー図</title>
  <desc id="desc">音声 waveform から emotion2vec、frame-level features、masked mean pooling、FNN、VAD、ロジスティック回帰、softmax、感情確率、最大確率の推定感情へ進む縦方向の構造図。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif; font-size: 30px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif; font-size: 17px; fill: #475569; }
      .box { stroke-width: 2; filter: url(#softShadow); }
      .boxText { font-family: "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif; font-size: 21px; font-weight: 700; fill: #111827; text-anchor: middle; dominant-baseline: middle; }
      .boxSub { font-family: "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif; font-size: 15px; font-weight: 500; fill: #475569; text-anchor: middle; dominant-baseline: middle; }
      .arrow { stroke: #334155; stroke-width: 2.6; fill: none; marker-end: url(#arrow); }
      .groupLabel { font-family: "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 0; fill: #334155; text-anchor: middle; }
      .noteTitle { font-family: "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif; font-size: 17px; font-weight: 700; fill: #111827; }
      .noteText { font-family: "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif; font-size: 15px; fill: #475569; }
      .small { font-family: "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif; font-size: 13px; fill: #64748b; }
    </style>
  </defs>

  <rect class="bg" width="960" height="1420"/>
  <text class="title" x="70" y="58">VAD媒介型感情分類モデル</text>
  <text class="subtitle" x="70" y="88">emotion2vec特徴量を直接分類せず、予測VADを経由して感情確率を出す</text>

  <rect x="62" y="120" width="526" height="1250" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text class="groupLabel" x="325" y="150">縦方向フロー</text>

  <rect class="box" x="120" y="180" width="410" height="72" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
  <text class="boxText" x="325" y="216">音声 waveform</text>

  <path class="arrow" d="M325 252 L325 290"/>

  <rect class="box" x="120" y="292" width="410" height="72" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
  <text class="boxText" x="325" y="328">emotion2vec 本体</text>

  <path class="arrow" d="M325 364 L325 402"/>

  <rect class="box" x="120" y="404" width="410" height="78" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
  <text class="boxText" x="325" y="435">frame-level features</text>
  <text class="boxSub" x="325" y="462">[時間, 768]</text>

  <path class="arrow" d="M325 482 L325 520"/>

  <rect class="box" x="120" y="522" width="410" height="72" rx="8" fill="#ecfeff" stroke="#0891b2"/>
  <text class="boxText" x="325" y="558">masked mean pooling</text>

  <path class="arrow" d="M325 594 L325 632"/>

  <rect class="box" x="120" y="634" width="410" height="72" rx="8" fill="#ecfeff" stroke="#0891b2"/>
  <text class="boxText" x="325" y="670">FNN</text>

  <path class="arrow" d="M325 706 L325 744"/>

  <rect class="box" x="120" y="746" width="410" height="82" rx="8" fill="#ecfdf5" stroke="#10b981"/>
  <text class="boxText" x="325" y="779">Valence / Arousal / Dominance</text>
  <text class="boxSub" x="325" y="806">予測VAD</text>

  <path class="arrow" d="M325 828 L325 866"/>

  <rect class="box" x="120" y="868" width="410" height="94" rx="8" fill="#fff7ed" stroke="#f97316"/>
  <text class="boxText" x="325" y="900">ロジスティック回帰</text>
  <text class="boxSub" x="325" y="924">Linear(3 -&gt; 4)</text>
  <text class="boxSub" x="325" y="946">多クラスsoftmax回帰のlogits</text>

  <path class="arrow" d="M325 962 L325 1000"/>

  <rect class="box" x="120" y="1002" width="410" height="72" rx="8" fill="#fff7ed" stroke="#f97316"/>
  <text class="boxText" x="325" y="1038">softmax</text>

  <path class="arrow" d="M325 1074 L325 1112"/>

  <rect class="box" x="120" y="1114" width="410" height="86" rx="8" fill="#fdf2f8" stroke="#db2777"/>
  <text class="boxText" x="325" y="1146">喜び / 悲しみ / 怒り / 嫌悪</text>
  <text class="boxSub" x="325" y="1174">の確率</text>

  <path class="arrow" d="M325 1200 L325 1238"/>

  <rect class="box" x="120" y="1240" width="410" height="86" rx="8" fill="#f5f3ff" stroke="#7c3aed"/>
  <text class="boxText" x="325" y="1272">最大確率のクラス</text>
  <text class="boxSub" x="325" y="1300">= 推定感情</text>

  <path d="M592 405 L612 405 L612 482 L592 482" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <path d="M592 746 L612 746 L612 828 L592 828" fill="none" stroke="#10b981" stroke-width="2"/>
  <path d="M592 868 L612 868 L612 1200 L592 1200" fill="none" stroke="#f97316" stroke-width="2"/>

  <rect x="640" y="335" width="250" height="92" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="noteTitle" x="660" y="365">直接分類しない</text>
  <text class="noteText" x="660" y="392">分類器は768次元特徴を</text>
  <text class="noteText" x="660" y="414">直接見ない</text>

  <rect x="640" y="730" width="250" height="92" rx="8" fill="#ecfdf5" stroke="#86efac" stroke-width="1.5"/>
  <text class="noteTitle" x="660" y="760">分類根拠</text>
  <text class="noteText" x="660" y="787">分類根拠は予測VAD</text>
  <text class="small" x="660" y="812">3次元の心理量を媒介にする</text>

  <rect x="640" y="900" width="250" height="100" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text class="noteTitle" x="660" y="930">学習時</text>
  <text class="noteText" x="660" y="957">CCC loss</text>
  <text class="noteText" x="660" y="982">+ CrossEntropyLoss</text>

  <rect x="640" y="1040" width="250" height="118" rx="8" fill="#fdf2f8" stroke="#fbcfe8" stroke-width="1.5"/>
  <text class="noteTitle" x="660" y="1070">推論時</text>
  <text class="noteText" x="660" y="1098">logits -&gt; softmax</text>
  <text class="noteText" x="660" y="1123">-&gt; argmax</text>
  <text class="small" x="660" y="1148">最大確率を推定感情にする</text>

  <text class="small" x="70" y="1392">注: Linear(3 -&gt; 4) は4クラスのlogitsを出し、softmaxで各感情の確率に変換する。</text>
</svg>
